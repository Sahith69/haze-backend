services:
  - type: web
    name: haze-backend
    env: docker
    plan: free
    region: oregon
    healthCheckPath: /api/trending
    envVars:
      - key: PORT
        value: 3001
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET_NAME
        value: haze-vault
      - key: R2_PUBLIC_URL
        sync: false
