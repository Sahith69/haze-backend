services:
  - type: web
    name: haze-backend
    env: docker
    plan: free
    region: oregon
    healthCheckPath: /api/trending
    envVars:
      - key: PORT
        value: 3001
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: TELEGRAM_API_ID
        sync: false
      - key: TELEGRAM_API_HASH
        sync: false
      - key: TELEGRAM_USER_SESSION
        sync: false
      - key: AUTO_ARCHIVE_TG
        value: "true"
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET_NAME
        value: haze-vault
      - key: R2_PUBLIC_URL
        sync: false
